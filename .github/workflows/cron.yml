name: Import Products Cron

on:
  schedule:
    - cron: '0 2 * * *'  # Запускается в 2 AM UTC каждый день
  workflow_dispatch:     # Возможность запустить вручную

jobs:
  import:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Import products
        run: npm run import:products
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Добавьте другие переменные окружения если нужны
      
      - name: Convert images
        run: npm run convert:images
      
      - name: Upload images
        run: npm run upload:images
